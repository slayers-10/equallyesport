<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#e5000a"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Equally"/>
  <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Page introuvable | Equally Esport</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <link rel="stylesheet" href="/css/variables.css"/>
  <link rel="stylesheet" href="/css/reset.css"/>
  <style>
    body { background:#050505; color:#fff; margin:0; overflow:hidden; }
    /* Particules */
    .particles { position:fixed; inset:0; pointer-events:none; }
    .particle { position:absolute; width:2px; height:2px; background:rgba(229,0,10,.5); border-radius:50%; animation:float-up linear infinite; }
    @keyframes float-up { 0%{transform:translateY(100vh);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-50px) translateX(var(--dx));opacity:0} }

    /* Contenu */
    .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; position:relative; z-index:10; padding:2rem; }
    .inner { max-width:600px; }

    /* Logo */
    .logo-wrap { margin-bottom:2rem; opacity:0; animation:fade-up .6s ease-out .1s forwards; }
    .logo-img { width:130px; height:auto; max-height:80px; object-fit:contain; margin:0 auto; filter:drop-shadow(0 0 20px rgba(229,0,10,.5)); animation:pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{filter:drop-shadow(0 0 10px rgba(229,0,10,.4))} 50%{filter:drop-shadow(0 0 30px rgba(229,0,10,.8))} }

    /* 404 */
    .error-code {
      font-family:var(--font-display, 'Barlow Condensed', sans-serif);
      font-style:italic; font-weight:900;
      font-size:clamp(8rem,20vw,14rem);
      line-height:.9;
      color:transparent;
      -webkit-text-stroke:2px rgba(229,0,10,.3);
      position:relative;
      margin-bottom:0;
      opacity:0; animation:fade-up .6s ease-out .2s forwards;
    }
    .error-code::before {
      content:'404';
      position:absolute; inset:0;
      color:var(--color-red, #e5000a);
      -webkit-text-stroke:0;
      clip-path:inset(0 100% 0 0);
      animation:reveal-text 1s ease-out .5s forwards;
    }
    @keyframes reveal-text { to { clip-path:inset(0 0% 0 0); } }

    .glitch-line { width:80px; height:3px; background:linear-gradient(90deg,transparent,#e5000a,transparent); margin:.5rem auto 1.5rem; opacity:0; animation:fade-up .6s ease-out .6s forwards; }

    .error-title {
      font-family:var(--font-display, sans-serif);
      font-style:italic; font-weight:900;
      font-size:clamp(1.5rem,4vw,2.5rem);
      text-transform:uppercase;
      margin-bottom:.75rem;
      opacity:0; animation:fade-up .6s ease-out .7s forwards;
    }
    .error-sub { color:#555; font-size:1rem; line-height:1.6; margin-bottom:2.5rem; opacity:0; animation:fade-up .6s ease-out .8s forwards; }

    /* Boutons */
    .btns { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; opacity:0; animation:fade-up .6s ease-out .9s forwards; }
    .btn-home {
      display:inline-flex; align-items:center; gap:.5rem;
      background:#e5000a; color:#fff;
      font-family:var(--font-display, sans-serif); font-style:italic; font-weight:700;
      font-size:1rem; text-transform:uppercase; text-decoration:none;
      padding:.7rem 1.75rem; border-radius:8px;
      transition:all .25s;
    }
    .btn-home:hover { background:#ff2030; transform:translateY(-2px); box-shadow:0 8px 24px rgba(229,0,10,.4); }
    .btn-back {
      display:inline-flex; align-items:center; gap:.5rem;
      background:transparent; color:#888;
      font-family:var(--font-display, sans-serif); font-style:italic; font-weight:700;
      font-size:1rem; text-transform:uppercase; text-decoration:none;
      padding:.7rem 1.75rem; border-radius:8px;
      border:1px solid rgba(255,255,255,.1);
      transition:all .25s; cursor:pointer;
    }
    .btn-back:hover { border-color:rgba(229,0,10,.4); color:#fff; }

    /* Terminal glitch */
    .terminal-hint {
      margin-top:2.5rem;
      font-family:monospace; font-size:.8rem; color:#2a2a2a;
      opacity:0; animation:fade-up .6s ease-out 1.1s forwards;
    }
    .terminal-hint span { color:#e5000a; }

    @keyframes fade-up { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    /* Barre top */
    .top-bar { position:fixed; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,#e5000a,transparent); animation:scan 3s ease-in-out infinite; }
    @keyframes scan { 0%,100%{opacity:.3}50%{opacity:1} }

    /* Easter egg */
    .error-code { cursor:pointer; user-select:none; }
    .egg-shake { animation: egg-glitch .4s steps(2,end) !important; }
    @keyframes egg-glitch {
      0%,100% { transform:translate(0,0); }
      20% { transform:translate(-6px,2px); text-shadow:3px 0 #e5000a,-3px 0 #00e5ff; }
      40% { transform:translate(6px,-2px); text-shadow:-3px 0 #e5000a,3px 0 #00e5ff; }
      60% { transform:translate(-4px,0); text-shadow:2px 0 #e5000a,-2px 0 #00e5ff; }
      80% { transform:translate(4px,1px); text-shadow:none; }
    }
    .egg-msg {
      margin-top:1.5rem; font-family:monospace; font-size:.85rem; color:#e5000a;
      opacity:0; max-height:0; overflow:hidden; transition:opacity .4s ease, max-height .4s ease, margin .4s ease;
    }
    .egg-msg.show { opacity:1; max-height:60px; margin-top:1.5rem; }
    .egg-hint { font-size:.65rem; color:#2a2a2a; margin-top:.5rem; font-family:monospace; }
  </style>
</head>
<body>

<div class="top-bar"></div>
<div class="particles" id="particles"></div>

<div class="wrap">
  <div class="inner">

    <div class="logo-wrap">
      <img src="/assets/logo/logo-trimmed.png" alt="Equally Esport" class="logo-img"/>
    </div>

    <div class="error-code" id="error-code">404</div>
    <div class="egg-msg" id="egg-msg">🏆 GG WP — tu as trouvé l'easter egg. Un vrai pro clique jusqu'au bout.</div>
    <div class="glitch-line"></div>

    <div class="error-title">Page introuvable</div>
    <p class="error-sub">
      Cette page n'existe pas ou a été déplacée.<br>
      Retourne à l'accueil et continue ta route vers la victoire.
    </p>

    <div class="btns">
      <a href="/index.html" class="btn-home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Accueil
      </a>
      <button onclick="history.back()" class="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Retour
      </button>
    </div>

    <div class="terminal-hint">
      <span>$</span> error: route <span>/???</span> not found — <span>exit code 404</span>
    </div>

  </div>
</div>

<script>
  // Particules
  const c = document.getElementById('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `left:${Math.random()*100}%;animation-duration:${5+Math.random()*8}s;animation-delay:${-Math.random()*10}s;--dx:${Math.random()*80-40}px`;
    c.appendChild(p);
  }
</script>

<script>
  // Easter egg : 5 clics sur le "404"
  (function () {
    const code = document.getElementById('error-code');
    const msg = document.getElementById('egg-msg');
    let clicks = 0;
    let revealed = false;

    code.addEventListener('click', () => {
      clicks++;

      // Petit effet glitch à chaque clic
      code.classList.remove('egg-shake');
      void code.offsetWidth; // reset animation
      code.classList.add('egg-shake');

      if (clicks >= 5 && !revealed) {
        revealed = true;
        msg.classList.add('show');
        // petite pluie de particules bonus
        const cont = document.getElementById('particles');
        for (let i = 0; i < 15; i++) {
          const p = document.createElement('div');
          p.className = 'particle';
          p.style.cssText = `left:${Math.random()*100}%;animation-duration:${3+Math.random()*4}s;animation-delay:${-Math.random()*4}s;--dx:${Math.random()*80-40}px;background:rgba(255,255,255,.6)`;
          cont.appendChild(p);
        }
      }
    });
  })();
</script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
